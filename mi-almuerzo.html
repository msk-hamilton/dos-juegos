<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi almuerzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4FA; --surface:#FFFFFF; --ink:#1D2D50; --muted:#52627F; --line:#C3D2E6;
  --tray:#1D2D50; --rim:rgba(255,255,255,.14);
  --accent:#CF3A24; --on-accent:#FFFFFF; --good:#2E8B44; --good-soft:#DDF1E1; --warn:#9A5B00; --warn-soft:#FFF0C7; --sun:#FFB627; --focus:#1D6FEA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E172E; --surface:#17233F; --ink:#EEF3FF; --muted:#A9B8D8; --line:#31456B;
    --tray:#08101F; --rim:rgba(255,255,255,.16);
    --accent:#FF7A5C; --on-accent:#2A0C05; --good:#5CC46E; --good-soft:#1C3A28; --warn:#FFC857; --warn-soft:#4A3B12; --sun:#FFC857; --focus:#8DBBFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E172E; --surface:#17233F; --ink:#EEF3FF; --muted:#A9B8D8; --line:#31456B;
  --tray:#08101F; --rim:rgba(255,255,255,.16);
  --accent:#FF7A5C; --on-accent:#2A0C05; --good:#5CC46E; --good-soft:#1C3A28; --warn:#FFC857; --warn-soft:#4A3B12; --sun:#FFC857; --focus:#8DBBFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:19px;line-height:1.4;}
.wrap{max-width:940px;margin:0 auto;padding:20px 18px 48px;}
h1,h2{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;margin:0;}
h1{font-size:clamp(38px,7vw,60px);line-height:1.05;}
h2{font-size:26px;margin:28px 0 10px;}
.sub{margin:4px 0 14px;font-size:20px;color:var(--muted);}
button,input{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}

.steps{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-wrap:wrap;gap:8px;}
.steps li{display:flex;gap:8px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 5px;font-weight:800;}
.steps .n{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:16px;}
.steps li.done{border-color:var(--good);background:var(--good-soft);}
.steps li.done .n{background:var(--good);border-color:var(--good);color:#fff;}

.inwrap{position:relative;}
.mark{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:800;color:var(--good);font-size:20px;pointer-events:none;}
.mark.maybe{color:var(--warn);font-size:15px;}
input[type=text]{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:8px 44px 8px 14px;min-height:52px;}
input.title{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:clamp(32px,6vw,48px);text-align:center;min-height:72px;border:3px dashed var(--ink);}

.board{background:var(--tray);border-radius:26px;padding:16px;box-shadow:inset 0 0 0 5px var(--rim);}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;}
.pick{position:relative;background:#fff;color:#1D2D50;border:0;border-radius:16px;min-height:136px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px;cursor:pointer;transition:box-shadow .15s;}
.pick:hover{box-shadow:0 0 0 5px var(--sun);}
.pick.on{box-shadow:0 0 0 6px var(--good);}
.pick img{width:82px;height:82px;object-fit:contain;border-radius:10px;}
.pick .w{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:18px;}
.pick .badge{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:var(--good);color:#fff;font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;display:flex;align-items:center;justify-content:center;}
.count{font-weight:800;margin:10px 2px 0;min-height:1.4em;}

.reflist{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px;}
.refitem{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 14px 6px 6px;}
.refitem img{width:64px;height:64px;object-fit:contain;border-radius:10px;background:#fff;}
.refitem b{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:21px;}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;}
.tools .gap{width:10px;}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line);cursor:pointer;}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink);}
.sz,.tl{min-height:44px;min-width:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:22px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;}
.sz i{display:block;border-radius:50%;background:var(--ink);}
.sz[aria-pressed="true"],.tl[aria-pressed="true"]{border-color:var(--ink);background:var(--bg);}
.draw{display:block;touch-action:none;width:100%;aspect-ratio:16/9;border:3px solid var(--ink);border-radius:16px;background:#fff;cursor:crosshair;}

.namerow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;margin:8px 0;}
.namerow img{width:64px;height:64px;object-fit:contain;border-radius:10px;background:#fff;border:2px solid var(--line);}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;}
.letters button{min-width:44px;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:800;cursor:pointer;font-size:20px;}

.btn{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:500;font-size:24px;padding:10px 34px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;min-height:56px;}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);}
.btn:disabled{opacity:.45;cursor:default;}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center;}
.note{background:var(--warn-soft);border-radius:14px;padding:10px 14px;margin:12px 0 0;font-weight:700;}
.hint{color:var(--muted);font-size:16px;}
.result img{display:block;width:100%;max-width:560px;border:3px solid var(--ink);border-radius:12px;background:#fff;margin:14px 0;}
[hidden]{display:none !important;}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mi almuerzo</h1>
  <p class="sub">Make your lunch menu!</p>

  <ol class="steps" id="steps"></ol>

  <div id="work">
    <h2>1. Write the title</h2>
    <div class="inwrap">
      <input type="text" id="title" class="title" autocomplete="off" spellcheck="false" placeholder="Mi almuerzo" aria-label="Title">
      <span class="mark" id="mk-title"></span>
    </div>

    <h2>2. Pick 3 foods</h2>
    <div class="board"><div class="menu" id="menu"></div></div>
    <p class="count" id="count" aria-live="polite"></p>

    <div id="after" hidden>
      <h2>3. Draw your 3 foods</h2>
      <div class="reflist" id="reflist"></div>
      <div class="tools" id="tools" role="group" aria-label="Drawing tools"></div>
      <div id="cvhold"></div>

      <h2>4. Write the names in Spanish</h2>
      <div id="names"></div>
      <div class="letters" id="letters" role="group" aria-label="Special letters">
        <button type="button" data-ch="á">á</button><button type="button" data-ch="é">é</button><button type="button" data-ch="í">í</button><button type="button" data-ch="ó">ó</button><button type="button" data-ch="ú">ú</button><button type="button" data-ch="ñ">ñ</button>
      </div>

      <div class="actions">
        <button class="btn" id="finish">Done</button>
        <span class="hint">If you close this page, your work is lost.</span>
      </div>
    </div>
  </div>

  <div id="result" class="result" hidden>
    <h2>Great job!</h2>
    <canvas id="final" width="1000" height="940" hidden></canvas>
    <img id="finalimg" alt="Your finished menu">
    <div class="actions">
      <button class="btn" id="save">Save my menu</button>
      <button class="btn alt" id="back">Keep working</button>
    </div>
    <p id="saveinfo" class="note"></p>
  </div>
</div>

  function syncTools(){
    document.querySelectorAll('.sw').forEach(function(b){b.setAttribute('aria-pressed',String(!S.tool.erase&&b.dataset.color===S.tool.color));});
    document.querySelectorAll('.sz').forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.size===S.tool.size));});
    document.querySelectorAll('[data-tool="erase"]').forEach(function(b){b.setAttribute('aria-pressed',String(S.tool.erase));});
  }

  /* ----- steps ----- */
  function renderSteps(){
    var three=S.picks.length===3;
    var d=[titleOk(),three,three&&cv.drawn,three&&namesDone()===3];
    var labels=['Title','Pick 3','Draw','Names'];
    $('#steps').innerHTML=labels.map(function(l,i){return '<li class="'+(d[i]?'done':'')+'"><span class="n" aria-hidden="true">'+(d[i]?'✓':(i+1))+'</span>'+l+'</li>';}).join('');
  }

  /* ----- title ----- */
  $('#title').addEventListener('input',function(){
    var v=this.value.trim(),m=$('#mk-title');
    if(!v){m.textContent='';m.className='mark';}
    else if(titleOk()){m.textContent='✓';m.className='mark';}
    else{m.textContent='Mi almuerzo';m.className='mark maybe';}
    renderSteps();
  });

  /* ----- picker ----- */
  function renderMenu(){
    $('#menu').innerHTML=ITEMS.map(function(f){
      var i=S.picks.indexOf(f.id);
      return '<button class="pick'+(i>-1?' on':'')+'" data-pick="'+f.id+'" aria-pressed="'+(i>-1)+'">'+(i>-1?'<span class="badge">'+(i+1)+'</span>':'')+'<img alt="" src="'+IMGS[f.id]+'"><span class="w">'+f.es+'</span></button>';
    }).join('');
    var n=S.picks.length;
    $('#count').textContent=n<3?('Picked '+n+' of 3'):'Picked 3 of 3. Tap one to swap it.';
  }
  function renderAfter(){
    var three=S.picks.length===3;
    $('#after').hidden=!three;
    if(!three)return;
    $('#reflist').innerHTML=S.picks.map(function(id,i){var f=byId(id);return '<div class="refitem"><img alt="" src="'+IMGS[id]+'"><b>'+f.es+'</b></div>';}).join('');
    $('#names').innerHTML=S.picks.map(function(id){
      var l=nameLevel(id),m=markFor(l);
      return '<div class="namerow"><img alt="" src="'+IMGS[id]+'"><div class="inwrap"><input type="text" class="nm" data-id="'+id+'" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Spanish name" value="'+esc(N[id]||'')+'"><span class="'+m[1]+'" id="mk-'+id+'">'+m[0]+'</span></div></div>';
    }).join('');
  }

  document.addEventListener('focusin',function(e){if(e.target&&e.target.tagName==='INPUT'&&e.target.type==='text')lastInput=e.target;});
  $('#letters').addEventListener('mousedown',function(e){e.preventDefault();});
  $('#letters').addEventListener('click',function(e){
    var b=e.target.closest('[data-ch]');if(!b)return;
    var el=lastInput&&lastInput.classList.contains('nm')?lastInput:document.querySelector('.nm');
    if(!el)return;
    var s=el.selectionStart==null?el.value.length:el.selectionStart,en=el.selectionEnd==null?s:el.selectionEnd;
    el.value=el.value.slice(0,s)+b.dataset.ch+el.value.slice(en);
    var p=s+1;try{el.setSelectionRange(p,p);}catch(x){}
    el.focus();el.dispatchEvent(new Event('input',{bubbles:true}));
  });

  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('nm')){
      var id=t.dataset.id;N[id]=t.value;
      var m=markFor(nameLevel(id)),el=$('#mk-'+id);el.textContent=m[0];el.className=m[1];
      renderSteps();
    }
  });
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-pick],[data-color],[data-size],[data-tool],[data-act]');
    if(!t)return;
    if(t.dataset.pick){
      var id=t.dataset.pick,i=S.picks.indexOf(id);
      if(i>-1)S.picks.splice(i,1);
      else if(S.picks.length<3)S.picks.push(id);
      else{$('#count').textContent='You already picked 3. Tap one to remove it first.';return;}
      renderMenu();renderAfter();renderSteps();return;
    }
    if(t.dataset.color){S.tool.color=t.dataset.color;S.tool.erase=false;syncTools();return;}
    if(t.dataset.size){S.tool.size=+t.dataset.size;syncTools();return;}
    if(t.dataset.tool==='erase'){S.tool.erase=!S.tool.erase;syncTools();return;}
    if(t.dataset.act==='undo'){cv.undoOne();renderSteps();return;}
    if(t.dataset.act==='clear'){
      if(t.dataset.armed){cv.clear();t.textContent='🗑️';delete t.dataset.armed;renderSteps();}
      else{t.dataset.armed='1';t.textContent='Sure?';setTimeout(function(){if(t.dataset.armed){t.textContent='🗑️';delete t.dataset.armed;}},2500);}
    }
  });

  /* ----- finished menu image ----- */

  function fitText(ctx,text,maxW,start,min,weight){
    var s=start;do{ctx.font=weight+' '+s+'px Fredoka, "Trebuchet MS", sans-serif';s-=2;}while(ctx.measureText(text).width>maxW&&s>min);
  }
  function buildFinal(){
    var c=$('#final'),ctx=c.getContext('2d'),CW=c.width,CH=c.height;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,CW,CH);
    ctx.strokeStyle='#1D2D50';ctx.lineWidth=10;ctx.strokeRect(20,20,CW-40,CH-40);
    ctx.lineWidth=3;ctx.strokeRect(38,38,CW-76,CH-76);
    ctx.fillStyle='#1D2D50';ctx.textAlign='center';ctx.textBaseline='alphabetic';
    var title=$('#title').value.trim()||'Mi almuerzo';
    fitText(ctx,title,860,100,44,'600');ctx.fillText(title,CW/2,165);
    ctx.drawImage(cv.c,40+0,215,920,Math.round(920*H/W));
    ctx.lineWidth=5;ctx.strokeRect(40,215,920,Math.round(920*H/W));
    var y=215+Math.round(920*H/W)+110;
    for(var i=0;i<3;i++){
      var id=S.picks[i];if(!id)continue;
      var nm=(N[id]||'').trim();if(!nm)continue;
      var cx=CW/6+(CW/3)*i;
      fitText(ctx,nm,290,58,24,'600');ctx.fillText(nm,cx,y);
    }
  }
  $('#finish').addEventListener('click',function(){
    function go(){
      buildFinal();
      $('#finalimg').src=$('#final').toDataURL('image/png');
      $('#work').hidden=true;$('#result').hidden=false;
      var missing=[];
      if(!titleOk())missing.push('the title');
      if(!cv.drawn)missing.push('the drawing');
      if(namesDone()<3)missing.push('the names');
      $('#saveinfo').textContent=(missing.length?'Still missing: '+missing.join(', ')+'. Tap “Keep working” to finish. ':'')+
        'To turn it in, tap “Save my menu.” On an iPad, press and hold the picture, then tap Save. Then upload it to Gradelink.';
      window.scrollTo(0,0);
    }
    try{ if(document.fonts&&document.fonts.load){document.fonts.load('600 60px Fredoka').then(go,go);} else go(); }catch(e){go();}
  });
  $('#back').addEventListener('click',function(){$('#result').hidden=true;$('#work').hidden=false;window.scrollTo(0,0);});
  $('#save').addEventListener('click',function(){
    $('#final').toBlob(function(blob){
      if(!blob){$('#saveinfo').textContent='Could not save. Press and hold the picture, then tap Save.';return;}
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='mi-almuerzo.png';document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},4000);
      $('#saveinfo').textContent='Saved! Find mi-almuerzo.png in your Downloads (or Photos on an iPad). Then upload it to Gradelink.';
    },'image/png');
  });

  renderTools();renderMenu();renderAfter();renderSteps();
})();
</script>
</body>
</html>
