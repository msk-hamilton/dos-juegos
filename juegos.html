<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almuerzo y cena: juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4FA; --surface:#FFFFFF; --ink:#1D2D50; --muted:#52627F; --line:#C3D2E6;
  --tray:#1D2D50; --rim:rgba(255,255,255,.14);
  --accent:#CF3A24; --on-accent:#FFFFFF; --good:#2E8B44; --good-soft:#DDF1E1; --sun:#FFB627; --focus:#1D6FEA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E172E; --surface:#17233F; --ink:#EEF3FF; --muted:#A9B8D8; --line:#31456B;
    --tray:#08101F; --rim:rgba(255,255,255,.16);
    --accent:#FF7A5C; --on-accent:#2A0C05; --good:#5CC46E; --good-soft:#1C3A28; --sun:#FFC857; --focus:#8DBBFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E172E; --surface:#17233F; --ink:#EEF3FF; --muted:#A9B8D8; --line:#31456B;
  --tray:#08101F; --rim:rgba(255,255,255,.16);
  --accent:#FF7A5C; --on-accent:#2A0C05; --good:#5CC46E; --good-soft:#1C3A28; --sun:#FFC857; --focus:#8DBBFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.45;}
.wrap{max-width:1000px;margin:0 auto;padding:20px 20px 40px;}
h1{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:clamp(34px,6vw,54px);line-height:1.05;margin:4px 0 4px;}
.sub{margin:0 0 18px;color:var(--muted);}
button{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;}
.tab{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:500;font-size:21px;padding:10px 22px;border-radius:999px;border:2px solid var(--ink);background:transparent;cursor:pointer;min-height:48px;}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);}

details.words{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 16px;margin:0 0 20px;}
details.words summary{cursor:pointer;font-weight:800;min-height:32px;display:flex;align-items:center;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 6px;}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;min-height:40px;}
.chip[aria-pressed="true"]{border-color:var(--good);background:var(--good-soft);}
.hint{color:var(--muted);font-size:15px;margin:4px 0 0;}

.stage{min-height:360px;}
.status{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 10px;}
.status .round{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:500;font-size:22px;}
.prompt{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:clamp(26px,4.4vw,40px);line-height:1.15;margin:0;}
.en{color:var(--muted);font-size:17px;margin:2px 0 0;}
.promptbox{margin:0 0 16px;min-height:76px;}

.tray{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:18px;background:var(--tray);border-radius:30px;box-shadow:inset 0 0 0 5px var(--rim);}
@media (min-width:760px){ .tray.four{grid-template-columns:repeat(4,1fr);} }
.cell{background:#fff;color:#1D2D50;border:0;border-radius:20px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 8px;text-align:center;transition:box-shadow .15s,opacity .15s;}
button.cell{cursor:pointer;}
button.cell:hover:not(:disabled){box-shadow:0 0 0 5px var(--sun);}
.pic{display:flex;align-items:center;justify-content:center;width:112px;height:112px;}
.pic img{width:100%;height:100%;object-fit:contain;border-radius:14px;}
.cell .w{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:clamp(21px,3vw,28px);min-height:1.25em;}
.cell .g{font-size:15px;color:#52627F;min-height:1.2em;}
.cell.gap{background:transparent;border:3px dashed rgba(255,255,255,.55);color:#fff;}
.cell.gap .q{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:84px;line-height:112px;}
.cell.found{box-shadow:0 0 0 7px var(--sun);}
.cell.right{box-shadow:0 0 0 7px var(--good);}
.cell.tried{opacity:.35;}
.cover{position:absolute;inset:0;border-radius:30px;background:var(--tray);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;z-index:2;}
.cover .big{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:clamp(72px,16vw,130px);line-height:1;}
.cover .lbl{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-size:26px;}

.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center;}
.btn{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:500;font-size:22px;padding:10px 26px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;min-height:54px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
.btn small{font-family:Nunito,system-ui,sans-serif;font-weight:700;font-size:13px;opacity:.9;}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);}
.btn:disabled{opacity:.45;cursor:default;}
.intro{background:var(--surface);border:2px solid var(--line);border-radius:30px;padding:40px 28px;}
.intro .btn{margin-top:22px;}
.stars{display:flex;flex-wrap:wrap;gap:2px;font-size:30px;line-height:1;color:var(--sun);}
.stars .o{opacity:.35;}
.msg{font-weight:800;min-height:1.6em;margin:12px 0 0;}
.frame{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:18px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px 22px;}
.frame .sentence{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:clamp(26px,4.4vw,40px);}
.frame .blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--muted);}
[hidden]{display:none !important;}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Almuerzo y cena</h1>
  <p class="sub">Juegos de la semana 8</p>

  <div class="tabs" role="tablist" aria-label="Juegos">
    <button class="tab" role="tab" id="tab1" aria-selected="true" aria-controls="g1" data-tab="1">¿Qué falta?</button>
    <button class="tab" role="tab" id="tab2" aria-selected="false" aria-controls="g2" data-tab="2">Escucha y señala</button>
    <button class="tab" role="tab" id="tab3" aria-selected="false" aria-controls="g3" data-tab="3">¿Te gusta?</button>

</div>

  var selected={};FOODS.forEach(function(f){selected[f.id]=1;});
  function $(s){return document.querySelector(s);}
  function byId(id){return FOODS.filter(function(f){return f.id===id;})[0];}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function pool(){return FOODS.filter(function(f){return selected[f.id];});}
  function joinY(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];}
  function joinAnd(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];}
  function pic(f){return '<span class="pic" aria-hidden="true"><img alt="" src="'+IMGS[f.id]+'"></span>';}
  function cell(f,cls){return '<div class="cell '+(cls||'')+'">'+pic(f)+'<span class="w">'+f.es+'</span><span class="g">'+f.en+'</span></div>';}

  /* ----- audio: recordings first, browser voice as backup ----- */
  var AUD={};
  Object.keys(CLIPS).forEach(function(k){var a=new Audio('data:audio/mpeg;base64,'+CLIPS[k]);a.preload='auto';AUD[k]=a;});
  var canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
  var voices=[];
  function loadVoices(){try{voices=window.speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
  if(canSpeak){loadVoices();try{window.speechSynthesis.addEventListener('voiceschanged',loadVoices);}catch(e){}}
  function speak(text){
    if(!canSpeak)return;
    try{
      var u=new SpeechSynthesisUtterance(text);
      var v=voices.filter(function(x){return /^es[-_](MX|US|419)/i.test(x.lang);})[0]||voices.filter(function(x){return /^es/i.test(x.lang);})[0];
      if(v){u.voice=v;u.lang=v.lang;}else{u.lang='es-MX';}
      u.rate=0.8;window.speechSynthesis.speak(u);
    }catch(e){}
  }
  var chain=0;
  function stopAudio(){
    chain++;
    Object.keys(AUD).forEach(function(k){try{AUD[k].pause();AUD[k].currentTime=0;AUD[k].onended=null;AUD[k].onerror=null;}catch(e){}});
    try{if(canSpeak)window.speechSynthesis.cancel();}catch(e){}
  }
  function playKeys(keys,fallbackText){
    stopAudio();
    var id=chain,i=0;
    function fail(){if(id!==chain)return;chain++;speak(fallbackText);}
    function next(){
      if(id!==chain||i>=keys.length)return;
      var a=AUD[keys[i++]];
      if(!a){fail();return;}
      a.currentTime=0;a.onended=function(){setTimeout(next,40);};a.onerror=fail;
      var p=a.play();if(p&&p.catch)p.catch(fail);
    }
    next();
  }

  /* ----- word chips ----- */
  function renderChips(){
    $('#chips').innerHTML=FOODS.map(function(f){
      var on=!!selected[f.id];
      return '<button class="chip" aria-pressed="'+on+'" data-chip="'+f.id+'">'+(on?'✓ ':'')+f.es+'</button>';
    }).join('');
  }
  function toggleChip(id){
    var count=Object.keys(selected).length;
    if(selected[id]){
      if(count<=4){$('#chiphint').textContent='You need at least four words.';return;}
      delete selected[id];
    }else{selected[id]=1;}
    $('#chiphint').textContent='Pick at least four. All 13 menu foods start switched on.';
    renderChips();g1Reset();g2Reset();g3New();
  }

  /* ----- Game 1: ¿Qué falta? ----- */
  var g1={round:0,phase:'idle',items:[],removed:[],count:5,timer:null};
  function g1Reset(){clearInterval(g1.timer);stopAudio();g1.phase='idle';g1.round=0;g1Render();}
  function g1Start(){g1.round=0;g1Next();}
  function g1Next(){
    stopAudio();g1.round++;
    if(g1.round>4){g1.phase='done';g1Render();return;}
    g1.items=shuffle(pool()).slice(0,4);
    g1.removed=shuffle([0,1,2,3]).slice(0,g1.round===4?2:1);
    g1.phase='study';g1Render();
  }
  function g1Close(){
    clearInterval(g1.timer);g1.phase='closed';g1.count=5;g1Render();
    g1.timer=setInterval(function(){
      g1.count--;
      if(g1.count<=0){clearInterval(g1.timer);g1.phase='guess';}
      g1Render();
    },1000);
  }
  function g1Render(){
    var el=$('#g1body'),g=g1;
    if(g.phase==='idle'){
      el.innerHTML='<div class="intro"><p class="prompt">Mira bien las comidas. Luego cierra los ojos.</p><p class="en">Look closely at the foods. Then close your eyes.</p><button class="btn" data-a="g1start">Empezar<small>Start</small></button></div>';return;
    }
    if(g.phase==='done'){
      el.innerHTML='<div class="intro"><p class="prompt">¡Muy bien, clase!</p><p class="en">Great job, class!</p><button class="btn" data-a="g1start">Jugar otra vez<small>Play again</small></button></div>';return;
    }
    var names=g.removed.map(function(i){return g.items[i].es;});
    var enNames=g.removed.map(function(i){return g.items[i].en;});
    var p1,p2;
    if(g.phase==='study'){p1='¡Miren! Recuerden las comidas.';p2='Look! Remember the foods.';}
    else if(g.phase==='closed'){p1='Ojos cerrados.';p2='Eyes closed.';}
    else if(g.phase==='guess'){
      if(g.removed.length===1){p1='¿Qué falta?';p2='What’s missing?';}
      else{p1='¿Qué falta? Faltan dos comidas.';p2='What’s missing? Two foods are missing.';}
    }else{
      p1=(g.removed.length===1?'Falta: ':'Faltan: ')+joinY(names)+'.';
      p2='Missing: '+joinAnd(enNames)+'.';
    }
    var tray=g.items.map(function(f,i){
      var rem=g.removed.indexOf(i)>-1;
      if(g.phase==='guess'&&rem)return '<div class="cell gap"><span class="q" aria-hidden="true">?</span><span class="w">&nbsp;</span><span class="g">&nbsp;</span></div>';
      if(g.phase==='reveal'&&rem)return cell(f,'found');
      return cell(f,'');
    }).join('');
    var cover=g.phase==='closed'?'<div class="cover" role="status"><span class="lbl">Cierren los ojos</span><span class="big">'+g.count+'</span></div>':'';
    var btn='';
    if(g.phase==='study')btn='<button class="btn" data-a="g1close">¡Cierren los ojos!<small>Close your eyes</small></button>';
    else if(g.phase==='guess')btn='<button class="btn" data-a="g1reveal">Mostrar respuesta<small>Show the answer</small></button>';
    else if(g.phase==='reveal')btn='<button class="btn" data-a="g1next">'+(g.round<4?'Siguiente ronda':'Terminar')+'<small>'+(g.round<4?'Next round':'Finish')+'</small></button>';
    el.innerHTML='<div class="status"><span class="round">Ronda '+g.round+' de 4</span></div>'+
      '<div class="promptbox" aria-live="polite"><p class="prompt">'+p1+'</p><p class="en">'+p2+'</p></div>'+
      '<div class="tray four">'+tray+cover+'</div>'+
      '<div class="controls">'+btn+'<button class="btn alt" data-a="g1reset">Empezar de nuevo<small>Start over</small></button></div>';
  }

  /* ----- Game 2: Escucha y señala ----- */
  var g2={phase:'idle',q:0,score:0,seq:[],target:null,opts:[],tried:{},firstTry:true,answered:false,showWord:false,results:[],msg:''};
  function g2Reset(){stopAudio();g2.phase='idle';g2.q=0;g2.score=0;g2.results=[];g2Render();}
  function g2Start(){
    var p=pool(),seq=[];
    while(seq.length<8)seq=seq.concat(shuffle(p));
    g2.seq=seq.slice(0,8);g2.q=0;g2.score=0;g2.results=[];g2Question();
  }
  function g2Question(){
    if(g2.q>=8){g2.phase='done';g2Render();playKeys(['muy_bien'],'¡Muy bien!');return;}
    var t=g2.seq[g2.q];
    var others=shuffle(pool().filter(function(f){return f.id!==t.id;})).slice(0,3);
    g2.target=t;g2.opts=shuffle([t].concat(others));g2.tried={};g2.firstTry=true;g2.answered=false;
    g2.showWord=false;g2.msg='';g2.phase='ask';g2Render();playKeys([t.id],t.es);
  }
  function g2Pick(id){
    if(g2.answered)return;
    if(id===g2.target.id){
      g2.answered=true;g2.results[g2.q]=g2.firstTry;if(g2.firstTry)g2.score++;
      g2.msg='¡Sí! '+g2.target.es+' = '+g2.target.en+'.';
      playKeys([g2.firstTry?'muy_bien':'si'],g2.firstTry?'¡Muy bien!':'¡Sí!');
    }else{
      g2.tried[id]=1;g2.firstTry=false;g2.msg='Casi. Escucha otra vez.';
      playKeys(['otra_vez'],'Otra vez.');
    }
    g2Render();
  }
  function g2Stars(){
    var h='';
    for(var i=0;i<8;i++)h+=g2.results[i]===true?'<span>★</span>':'<span class="o">☆</span>';
    return '<div class="stars" aria-label="Estrellas: '+g2.score+' de 8">'+h+'</div>';
  }
  function g2Render(){
    var el=$('#g2body'),g=g2;
    if(g.phase==='idle'){
      el.innerHTML='<div class="intro"><p class="prompt">Escucha la palabra. Señala la comida.</p><p class="en">Listen to the word. Point to the food. Get it on the first try to earn a star.</p><button class="btn" data-a="g2start">Empezar<small>Start</small></button></div>';return;
    }
    if(g.phase==='done'){
      el.innerHTML='<div class="intro"><p class="prompt">¡Terminamos! '+g.score+' de 8</p><p class="en">All done! '+g.score+' of 8 on the first try.</p>'+g2Stars()+'<button class="btn" data-a="g2start">Jugar otra vez<small>Play again</small></button></div>';return;
    }
    var tray=g.opts.map(function(f){
      var cls=g.answered&&f.id===g.target.id?' right':(g.tried[f.id]?' tried':'');
      var showW=g.answered||g.tried[f.id];
      return '<button class="cell'+cls+'" data-pick="'+f.id+'" '+(g.answered?'disabled':'')+'>'+pic(f)+'<span class="w">'+(showW?f.es:'&nbsp;')+'</span><span class="g">'+(showW?f.en:'&nbsp;')+'</span></button>';
    }).join('');
    var word=g.showWord?'<p class="en" style="font-size:24px;color:var(--ink);font-weight:800;margin:6px 0 0;">'+g.target.es+'</p>':'';
    var next=g.answered?'<button class="btn" data-a="g2next">'+(g.q<7?'Siguiente':'Ver resultado')+'<small>'+(g.q<7?'Next':'See result')+'</small></button>':'';
    el.innerHTML='<div class="status"><span class="round">Pregunta '+(g.q+1)+' de 8</span>'+g2Stars()+'</div>'+
      '<div class="promptbox"><p class="prompt">¿Cuál es?</p><p class="en">Which one is it?</p>'+word+'</div>'+
      '<div class="tray four">'+tray+'</div>'+
      '<p class="msg" aria-live="polite">'+g.msg+'</p>'+
      '<div class="controls"><button class="btn" data-a="g2listen">🔊 Escucha<small>Listen</small></button>'+
      '<button class="btn alt" data-a="g2word">'+(g.showWord?'Ocultar palabra':'Mostrar palabra')+'<small>'+(g.showWord?'Hide word':'Show word')+'</small></button>'+next+
      '<button class="btn alt" data-a="g2reset">Empezar de nuevo<small>Start over</small></button></div>';
  }

  /* ----- Game 3: ¿Te gusta? ----- */
  var g3={pair:[],chosen:null};
  function g3New(){stopAudio();g3.pair=shuffle(pool()).slice(0,2);g3.chosen=null;g3Render();}
  function g3Render(){
    var el=$('#g3body'),a=g3.pair[0],b=g3.pair[1];
    var cards=g3.pair.map(function(f){
      var on=g3.chosen&&g3.chosen.id===f.id;
      return '<button class="cell'+(on?' found':'')+'" data-like="'+f.id+'">'+pic(f)+'<span class="w">'+f.es+'</span><span class="g">'+f.en+'</span></button>';
    }).join('');
    var sentence=g3.chosen?'Me gusta '+g3.chosen.es+'.':'Me gusta <span class="blank">&nbsp;</span>.';
    var hear=g3.chosen?'<button class="btn alt" data-a="g3speak">🔊 Escucha<small>Listen</small></button>':'';
    el.innerHTML='<div class="promptbox"><p class="prompt">¿Te gusta '+a.es+' o '+b.es+'?</p><p class="en">Do you like '+a.en+' or '+b.en+'?</p></div>'+
      '<div class="tray" style="grid-template-columns:repeat(2,1fr)">'+cards+'</div>'+
      '<div class="frame"><span class="sentence">'+sentence+'</span>'+hear+'</div>'+
      '<div class="controls"><button class="btn alt" data-a="g3ask">🔊 ¿Te gusta…?<small>Ask the question</small></button>'+
      '<button class="btn" data-a="g3new">Otra pareja<small>Another pair</small></button></div>';
  }

  /* ----- tabs + events ----- */
  function showTab(n){
    clearInterval(g1.timer);
    if(g1.phase==='closed'){g1.phase='study';g1Render();}
    stopAudio();
    [1,2,3].forEach(function(i){$('#g'+i).hidden=(i!==n);$('#tab'+i).setAttribute('aria-selected',String(i===n));});
  }
  function likeSentence(){return 'Me gusta '+g3.chosen.es+'.';}
  document.addEventListener('click',function(ev){
    var t=ev.target.closest('[data-tab],[data-a],[data-pick],[data-like],[data-chip]');
    if(!t)return;
    if(t.dataset.tab){showTab(+t.dataset.tab);return;}
    if(t.dataset.chip){toggleChip(t.dataset.chip);return;}
    if(t.dataset.pick){g2Pick(t.dataset.pick);return;}
    if(t.dataset.like){g3.chosen=byId(t.dataset.like);g3Render();playKeys(['me_gusta',g3.chosen.id],likeSentence());return;}
    switch(t.dataset.a){
      case 'g1start':g1Start();break;
      case 'g1close':g1Close();break;
      case 'g1reveal':g1.phase='reveal';g1Render();
        playKeys(g1.removed.map(function(i){return g1.items[i].id;}),joinY(g1.removed.map(function(i){return g1.items[i].es;})));break;
      case 'g1next':g1Next();break;
      case 'g1reset':g1Reset();break;
      case 'g2start':g2Start();break;
      case 'g2listen':playKeys([g2.target.id],g2.target.es);break;
      case 'g2word':g2.showWord=!g2.showWord;g2Render();break;
      case 'g2next':g2.q++;g2Question();break;
      case 'g2reset':g2Reset();break;
      case 'g3new':g3New();break;
      case 'g3speak':if(g3.chosen)playKeys(['me_gusta',g3.chosen.id],likeSentence());break;
      case 'g3ask':playKeys(['te_gusta',g3.pair[0].id,'o',g3.pair[1].id],'¿Te gusta '+g3.pair[0].es+' o '+g3.pair[1].es+'?');break;
    }
  });

  renderChips();g1Render();g2Render();g3New();
})();
</script>
</body>
</html>
