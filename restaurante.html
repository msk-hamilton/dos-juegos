<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurante de la clase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4FA; --surface:#FFFFFF; --ink:#1D2D50; --muted:#52627F; --line:#C3D2E6;
  --tray:#1D2D50; --rim:rgba(255,255,255,.14); --cell:#FFFFFF; --cell-ink:#1D2D50;
  --accent:#CF3A24; --on-accent:#FFFFFF; --good:#2E8B44; --good-soft:#DDF1E1; --sun:#FFB627; --focus:#1D6FEA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E172E; --surface:#17233F; --ink:#EEF3FF; --muted:#A9B8D8; --line:#31456B;
    --tray:#08101F; --rim:rgba(255,255,255,.16); --cell:#FFFFFF; --cell-ink:#1D2D50;
    --accent:#FF7A5C; --on-accent:#2A0C05; --good:#5CC46E; --good-soft:#1C3A28; --sun:#FFC857; --focus:#8DBBFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E172E; --surface:#17233F; --ink:#EEF3FF; --muted:#A9B8D8; --line:#31456B;
  --tray:#08101F; --rim:rgba(255,255,255,.16); --cell:#FFFFFF; --cell-ink:#1D2D50;
  --accent:#FF7A5C; --on-accent:#2A0C05; --good:#5CC46E; --good-soft:#1C3A28; --sun:#FFC857; --focus:#8DBBFF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.45;}
.wrap{max-width:1100px;margin:0 auto;padding:20px 20px 40px;}
h1{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:clamp(34px,6vw,54px);line-height:1.05;margin:4px 0 4px;}
.sub{margin:0 0 16px;color:var(--muted);}
button{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;}

.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;}
.tab{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:500;font-size:21px;padding:10px 22px;border-radius:999px;border:2px solid var(--ink);background:transparent;cursor:pointer;min-height:48px;}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);}
.stylerow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 16px;}
.stylerow .lab{font-weight:800;margin-right:4px;}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 16px;font-weight:700;cursor:pointer;min-height:40px;}
.chip[aria-pressed="true"]{border-color:var(--good);background:var(--good-soft);}

details.opts{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 16px;margin:0 0 18px;}
details.opts summary{cursor:pointer;font-weight:800;min-height:32px;display:flex;align-items:center;}
textarea{font:inherit;width:min(420px,100%);min-height:84px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px;margin-top:8px;}
label.lab{display:block;font-weight:800;margin-top:8px;}
.hint{color:var(--muted);font-size:15px;margin:4px 0 0;}

.prompt{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:clamp(26px,4.2vw,38px);line-height:1.15;margin:0;}
.en{color:var(--muted);font-size:17px;margin:2px 0 0;}
.promptrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:0 0 16px;}

.layout{display:grid;grid-template-columns:1fr;gap:18px;align-items:start;}
@media (min-width:920px){ .layout{grid-template-columns:1.7fr 1fr;} }

.board{background:var(--tray);border-radius:30px;padding:18px;box-shadow:inset 0 0 0 5px var(--rim);}
.board h2{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:500;font-size:24px;color:#fff;margin:4px 6px 10px;}
.board h2:not(:first-child){margin-top:18px;}
.board h2 small{font-family:Nunito,system-ui,sans-serif;font-size:14px;font-weight:700;opacity:.8;margin-left:8px;}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px;}
.item{background:var(--cell);color:var(--cell-ink);border:0;border-radius:18px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px;text-align:center;transition:box-shadow .15s;}
button.item{cursor:pointer;}
button.item:hover{box-shadow:0 0 0 5px var(--sun);}
.item.on{box-shadow:0 0 0 6px var(--good);}
.pic{display:flex;align-items:center;justify-content:center;width:64px;height:64px;font-size:54px;line-height:1;}
.pic img{width:100%;height:100%;object-fit:contain;border-radius:12px;}
.item .pic{width:92px;height:92px;}
.item .w{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:19px;}

.ticket{background:var(--surface);border:3px dashed var(--line);border-radius:24px;padding:18px 20px;}
.ticket h2{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:28px;margin:0 0 2px;}
.who{color:var(--muted);font-weight:800;margin:0 0 10px;min-height:1.4em;}
.lines{list-style:none;margin:0 0 10px;padding:0;min-height:60px;}
.lines li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:500;font-size:22px;}
.lines li .pic{width:48px;height:48px;font-size:36px;}
.lines li .slot{color:var(--muted);font-size:14px;font-family:Nunito,system-ui,sans-serif;font-weight:800;width:92px;flex:none;}
.lines li.blank{color:var(--muted);}
.lines li .x{margin-left:auto;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);min-width:40px;min-height:40px;border-radius:50%;}
.lines .empty{color:var(--muted);font-family:Nunito,system-ui,sans-serif;font-size:17px;border:0;}
.sentence{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:600;font-size:26px;line-height:1.2;margin:8px 0 2px;}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center;}
.btn{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;font-weight:500;font-size:21px;padding:8px 22px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;min-height:52px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;}
.btn small{font-family:Nunito,system-ui,sans-serif;font-weight:700;font-size:13px;opacity:.9;}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);}
.btn:disabled{opacity:.45;cursor:default;}
.served{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;}
.served .pic{width:96px;height:96px;font-size:72px;}
.reply{background:var(--good-soft);border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:800;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.stagebox{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin:0 0 18px;}
.face{font-size:clamp(80px,14vw,120px);line-height:1;}
.bubble{background:var(--surface);border:3px solid var(--ink);border-radius:30px;padding:14px 26px;display:flex;gap:16px;min-height:100px;align-items:center;}
.bubble .pic{width:104px;height:104px;font-size:72px;}
.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.revealbox{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 22px;margin-top:16px;}
[hidden]{display:none !important;}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Restaurante de la clase</h1>
  <p class="sub">Toma la orden de tus clientes.</p>

  <div class="top">
    <div class="tabs" role="tablist" aria-label="Modos">
      <button class="tab" role="tab" id="tab1" aria-selected="true" aria-controls="p1" data-tab="1">Tomo tu orden</button>
      <button class="tab" role="tab" id="tab2" aria-selected="false" aria-controls="p2" data-tab="2">¿Qué quiere?</button>
    </div>
  </div>

  <div class="stylerow" role="group" aria-label="Tipo de orden">
    <span class="lab">Orden:</span>
    <button class="chip" id="stcombo" aria-pressed="true" data-style="combo">Combo: uno de cada</button>
    <button class="chip" id="stfree" aria-pressed="false" data-style="free">Libre: hasta cuatro</button>
  </div>

  <details class="opts">
    <summary>Lista de clientes</summary>
    <label class="lab" for="names">Nombres</label>
    <textarea id="names" placeholder="Escribe un nombre por línea o separados por comas"></textarea>
    <p class="hint">Optional. Names are only kept while this page is open and are never saved or sent anywhere.</p>
  </details>

  <section id="p1" role="tabpanel" aria-labelledby="tab1"></section>
  <section id="p2" role="tabpanel" aria-labelledby="tab2" hidden></section>
</div>

  var S={tab:1,style:'combo',order:[],served:false,customer:'',queue:[],queueKey:'',hint:'',
         v:{n:2,items:[],revealed:false,face:'🧒',showMenu:true}};

  function $(s){return document.querySelector(s);}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function byId(id){return ITEMS.filter(function(f){return f.id===id;})[0];}
  function catIdx(f){for(var i=0;i<CATS.length;i++)if(CATS[i].id===f.c)return i;return 0;}
  function pic(f){return '<span class="pic" aria-hidden="true">'+(f.img?'<img alt="" src="'+f.img+'">':f.e)+'</span>';}
  function joinY(a){return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];}
  function sentenceFor(list){return 'Quiero '+joinY(list.map(function(f){return f.es;}))+', por favor.';}
  function orderList(){
    var l=S.order.map(byId);
    if(S.style==='combo')l.sort(function(a,b){return catIdx(a)-catIdx(b);});
    return l;
  }
  function isReady(){
    if(S.style==='combo'){var cs={};S.order.forEach(function(id){cs[byId(id).c]=1;});return Object.keys(cs).length===3;}
    return S.order.length>0;
  }

  /* ---------- audio: your recordings, with the browser voice as backup ---------- */
  var AUD={};
  Object.keys(CLIPS).forEach(function(k){var a=new Audio('data:audio/mpeg;base64,'+CLIPS[k]);a.preload='auto';AUD[k]=a;});
  var canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
  var voices=[];
  function loadVoices(){try{voices=window.speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
  if(canSpeak){loadVoices();try{window.speechSynthesis.addEventListener('voiceschanged',loadVoices);}catch(e){}}
  function speak(text){
    if(!canSpeak)return;
    try{
      var u=new SpeechSynthesisUtterance(text);
      var v=voices.filter(function(x){return /^es[-_](MX|US|419)/i.test(x.lang);})[0]||voices.filter(function(x){return /^es/i.test(x.lang);})[0];
      if(v){u.voice=v;u.lang=v.lang;}else{u.lang='es-MX';}
      u.rate=0.8;window.speechSynthesis.speak(u);
    }catch(e){}
  }
  var chain=0;
  function stopAudio(){
    chain++;
    Object.keys(AUD).forEach(function(k){try{AUD[k].pause();AUD[k].currentTime=0;AUD[k].onended=null;AUD[k].onerror=null;}catch(e){}});
    try{if(canSpeak)window.speechSynthesis.cancel();}catch(e){}
  }
  function playKeys(keys,fallbackText){
    stopAudio();
    var id=chain,i=0;
    function fail(){if(id!==chain)return;chain++;speak(fallbackText);}
    function next(){
      if(id!==chain||i>=keys.length)return;
      var a=AUD[keys[i++]];
      if(!a){fail();return;}
      a.currentTime=0;
      a.onended=function(){setTimeout(next,40);};
      a.onerror=fail;
      var p=a.play();if(p&&p.catch)p.catch(fail);
    }
    next();
  }
  function orderKeys(list){
    var k=['quiero'];
    list.forEach(function(f,i){if(i>0&&i===list.length-1)k.push('y');k.push(f.id);});
    k.push('por_favor');return k;
  }
  function sayOrder(list){playKeys(orderKeys(list),sentenceFor(list));}

  /* ---------- customers ---------- */
  function parseNames(){return ($('#names').value||'').split(/[\n,]+/).map(function(s){return s.trim();}).filter(Boolean);}
  function nextCustomer(){
    var names=parseNames(),key=names.join('|');
    if(!names.length){S.customer='';return;}
    if(S.queueKey!==key||!S.queue.length){S.queue=shuffle(names);S.queueKey=key;}
    S.customer=S.queue.pop();
  }

  function itemCard(f,asButton){
    var on=asButton&&S.order.indexOf(f.id)>-1;
    var inner=pic(f)+'<span class="w">'+f.es+'</span>';
    return asButton
      ? '<button class="item'+(on?' on':'')+'" data-add="'+f.id+'" aria-pressed="'+!!on+'">'+inner+'</button>'
      : '<div class="item">'+inner+'</div>';
  }
  function board(asButton){
    return '<div class="board">'+CATS.map(function(c,i){
      var hint=(asButton&&S.style==='combo')?'<small>elige uno</small>':'';
      return '<h2>'+c.es+hint+'</h2><div class="menu">'+ITEMS.filter(function(f){return f.c===c.id;}).map(function(f){return itemCard(f,asButton);}).join('')+'</div>';
    }).join('')+'</div>';
  }

  /* ---------- Mode 1: take the order ---------- */
  function render1(){
    var el=$('#p1'),list=orderList();
    var who=S.customer?'Cliente: '+esc(S.customer):'&nbsp;';
    var combo=S.style==='combo';
    var hasDrink=list.some(function(f){return f.c==='drink';});
    var prompts='<button class="btn alt" data-a="saywaiter">🔊 ¿Qué quieres?<small>What would you like?</small></button>'+
      ((combo&&!S.served&&!hasDrink)?'<button class="btn alt" data-a="saydrink">🔊 ¿Y para beber?<small>And to drink?</small></button>':'');
    var ticket;
    if(!S.served){
      var lines;
      if(combo){
        lines=CATS.map(function(c){
          var f=list.filter(function(x){return x.c===c.id;})[0];
          return f?'<li><span class="slot">'+c.slot+'</span>'+pic(f)+'<span>'+f.es+'</span><button class="x" data-del="'+f.id+'" aria-label="Quitar '+f.es+'">✕</button></li>'
                  :'<li class="blank"><span class="slot">'+c.slot+'</span><span>?</span></li>';
        }).join('');
      }else{
        lines=list.length?list.map(function(f){return '<li>'+pic(f)+'<span>'+f.es+'</span><button class="x" data-del="'+f.id+'" aria-label="Quitar '+f.es+'">✕</button></li>';}).join('')
                         :'<li class="empty">Toca un plato del menú para anotarlo.</li>';
      }
      var ready=isReady();
      var sent=list.length?sentenceFor(list):'Quiero ______, por favor.';
      var hear=list.length?'<button class="btn alt" data-a="sayorder">🔊 Escucha<small>Listen</small></button>':'';

      '<div class="layout">'+board(!S.served)+'<div>'+ticket+nextBtn+'</div></div>';
  }

  /* ---------- Mode 2: virtual customer ---------- */
  function newVirtual(){
    var v=S.v,items;
    if(S.style==='combo'){
      items=CATS.map(function(c){return shuffle(ITEMS.filter(function(f){return f.c===c.id;}))[0];});
    }else{
      items=shuffle(ITEMS).slice(0,v.n);
    }
    v.items=items;v.revealed=false;v.face=FACES[Math.floor(Math.random()*FACES.length)];
  }
  function render2(){
    var el=$('#p2'),v=S.v;
    if(!v.items.length)newVirtual();
    var seg='';
    if(S.style==='free'){
      seg=[1,2,3].map(function(n){return '<button class="chip" aria-pressed="'+(v.n===n)+'" data-n="'+n+'">'+n+(n===1?' comida':' comidas')+'</button>';}).join('');
    }
    var bubble=v.items.map(pic).join('');
    var rev='';
    if(v.revealed){
      rev='<div class="revealbox"><p class="sentence" style="margin-top:0">'+sentenceFor(v.items)+'</p><p class="en">'+v.items.map(function(f){return f.en;}).join(', ')+'</p></div>';
    }
    var show=v.revealed ? '' : '<button class="btn" data-a="reveal">Mostrar la frase<small>Show the sentence</small></button>';
    var hear=v.revealed?'<button class="btn alt" data-a="sayv">🔊 Escucha<small>Listen</small></button>':'';
    el.innerHTML='<div class="promptrow"><div><p class="prompt">¿Qué quiere el cliente?</p><p class="en">What does the customer want? Say the order in Spanish.</p></div></div>'+
      '<div class="stagebox"><span class="face" aria-hidden="true">'+v.face+'</span><div class="bubble" role="img" aria-label="El cliente quiere '+v.items.map(function(f){return f.en;}).join(' and ')+'">'+bubble+'</div></div>'+
      '<div class="seg">'+seg+'<button class="chip" aria-pressed="'+v.showMenu+'" data-a="menutoggle">'+(v.showMenu?'✓ ':'')+'Mostrar menú</button></div>'+
      '<div class="controls" style="margin-top:0">'+show+hear+'<button class="btn'+(v.revealed?'':' alt')+'" data-a="vnext">Siguiente cliente<small>Next customer</small></button></div>'+rev+
      (v.showMenu?'<div style="margin-top:18px">'+board(false)+'</div>':'');
  }

  function renderAll(){
    render1();render2();
    $('#stcombo').setAttribute('aria-pressed',String(S.style==='combo'));
    $('#stfree').setAttribute('aria-pressed',String(S.style==='free'));
  }
  function showTab(n){
    S.tab=n;stopAudio();
    $('#p1').hidden=(n!==1);$('#p2').hidden=(n!==2);
    $('#tab1').setAttribute('aria-selected',String(n===1));
    $('#tab2').setAttribute('aria-selected',String(n===2));
  }

  document.addEventListener('click',function(ev){
    var t=ev.target.closest('[data-tab],[data-a],[data-add],[data-del],[data-n],[data-style]');
    if(!t)return;
    if(t.dataset.tab){showTab(+t.dataset.tab);return;}
    if(t.dataset.style){
      if(S.style!==t.dataset.style){S.style=t.dataset.style;S.order=[];S.served=false;S.hint='';newVirtual();stopAudio();renderAll();}
      return;
    }
    if(t.dataset.add){
      var id=t.dataset.add,f=byId(id),i=S.order.indexOf(id);
      if(i>-1){S.order.splice(i,1);S.hint='';}
      else if(S.style==='combo'){S.order=S.order.filter(function(x){return byId(x).c!==f.c;});S.order.push(id);S.hint='';}
      else if(S.order.length>=4){S.hint='Máximo cuatro. Four items at most.';}
      else{S.order.push(id);S.hint='';}
      render1();return;
    }
    if(t.dataset.del){S.order=S.order.filter(function(x){return x!==t.dataset.del;});S.hint='';render1();return;}
    if(t.dataset.n){S.v.n=+t.dataset.n;newVirtual();render2();return;}
    switch(t.dataset.a){
      case 'serve':if(isReady()){S.served=true;render1();playKeys(['aqui_tienes'],'Aquí tienes.');}break;
      case 'clear':S.order=[];S.hint='';render1();break;
      case 'next':stopAudio();S.order=[];S.served=false;S.hint='';nextCustomer();render1();break;
      case 'saywaiter':playKeys(['que_quieres'],'¿Qué quieres?');break;
      case 'saydrink':playKeys(['y_para_beber'],'¿Y para beber?');break;
      case 'saythanks':playKeys(['gracias'],'Gracias.');break;
      case 'sayorder':sayOrder(orderList());break;
      case 'reveal':S.v.revealed=true;render2();sayOrder(S.v.items);break;
      case 'sayv':sayOrder(S.v.items);break;
      case 'vnext':stopAudio();newVirtual();render2();break;
      case 'menutoggle':S.v.showMenu=!S.v.showMenu;render2();break;
    }
  });

  renderAll();
})();
</script>
</body>
</html>
